name: Diagnosa OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Versi npm
        run: |
          node --version
          npm --version

      - name: Ketersediaan env OIDC
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC_URL=ada"
          else
            echo "OIDC_URL=TIDAK ADA"
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "OIDC_TOKEN=ada (panjang ${#ACTIONS_ID_TOKEN_REQUEST_TOKEN})"
          else
            echo "OIDC_TOKEN=TIDAK ADA"
          fi

      - name: Minta token OIDC
        run: |
          set -euo pipefail
          resp=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          echo "$resp" | head -c 200
          echo
          val=$(echo "$resp" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.value?('JWT_OK panjang '+j.value.length):('GAGAL: '+s.slice(0,160)))}catch(e){console.log('GAGAL parse: '+s.slice(0,160))}})")
          echo "$val"
