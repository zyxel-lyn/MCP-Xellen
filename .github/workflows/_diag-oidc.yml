name: Diagnosa OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Versi npm
        run: |
          node --version
          npm --version

      - name: Ketersediaan env OIDC
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC_URL=ada"; else echo "OIDC_URL=TIDAK ADA"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "OIDC_TOKEN=ada"; else echo "OIDC_TOKEN=TIDAK ADA"; fi

      - name: Tukar JWT ke npm (tanpa publish)
        run: |
          set -uo pipefail
          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{console.log(JSON.parse(s).value)})")
          echo "panjang JWT: ${#jwt}"

          echo "$jwt" | cut -d. -f2 | base64 -d 2>/dev/null | head -c 600
          echo

          code=$(curl -sS -o /tmp/exchange.json -w "%{http_code}" \
            -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/mcp-xellen-tools" \
            -H "Authorization: Bearer $jwt" \
            -H "Content-Type: application/json")
          echo "HTTP exchange: $code"
          head -c 400 /tmp/exchange.json
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Pertukaran OIDC ditolak npm (HTTP $code). Cek Trusted Publisher: owner/repo/workflow harus persis."
          fi
